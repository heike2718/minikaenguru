---
openapi: 3.0.3
info:
  title: mkbiza-api
  description: API für die Statistiken des Minikänguru-Wettbewerbs
  contact:
    name: Heike Winkelvoß
    url: https://mathe-jung-alt.de
    email: info@egladil.de
  license:
    name: MIT License
    url: https://mit-license.org/
  version: 3.0.0
servers:
- url: http://localhost:9540
  description: Auto generated value
- url: http://0.0.0.0:9540
  description: Auto generated value
tags:
- name: About
  description: Stellt Informationen über diese API zur Verfügung
- name: Wettbewerbe
paths:
  /mkbiza-api/about:
    get:
      tags:
      - About
      summary: Gibt Infos über die API zurück.
      operationId: getInfos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutDto'
        "500":
          description: Serverfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
  /mkbiza-api/wettbewerbe:
    get:
      tags:
      - Wettbewerbe
      summary: Gibt Minikänguru-Wettbewerbe sowie deren Status und Mediane zurück
      operationId: getWettbewerbe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wettbewerb'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
        "500":
          description: Serverfehler - Details stehen im server.log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
  /mkbiza-api/wettbewerbe/{jahr}:
    get:
      tags:
      - Wettbewerbe
      summary: Gibt die Gesamtstatistik eines Wettbewerbs zurück
      operationId: getStatistikWettbewerb
      parameters:
      - name: jahr
        in: path
        description: Jahr des Wettbewerbs - 4stellige Jahreszahl
        required: true
        schema:
          pattern: "^[\\d]{4}$"
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WettbewerbDetails'
        "400":
          description: Inputvalidierung schlug fehl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolationResponse'
        "404":
          description: Wettbewerb existsiert nicht oder ist noch nicht beendet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
        "500":
          description: Serverfehler - Details stehen im server.log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
  /mkbiza-api/wettbewerbe/{jahr}/{klassenstufe}:
    get:
      tags:
      - Wettbewerbe
      summary: Gibt die Aufgaben eines bestimmten Minikänguru-Wettbewerbs zurück.
      description: Nur freigegebene Wettbewerbe werden geliefert.
      operationId: getAufgabenMinikaenguruwettbewerb
      parameters:
      - name: jahr
        in: path
        description: Jahr des Wettbewerbs
        required: true
        schema:
          pattern: "^[\\d]{4}$"
          type: string
      - name: klassenstufe
        in: path
        description: "Eins von IKID,EINS,ZWEI - die Klassenstufe."
        required: true
        schema:
          $ref: '#/components/schemas/Klassenstufe'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinikaenguruKlassenstufeDto'
        "400":
          description: Input-Validierung ging schief.
        "404":
          description: Gibt es nicht
        "500":
          description: Serverfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
  /mkbiza-api/wettbewerbe/{jahr}/{klassenstufe}/aufgaben/{nummer}:
    get:
      tags:
      - Wettbewerbe
      summary: Gibt die Statistik für eine spezielle Aufgabe zurück
      operationId: getStatistikAufgabe
      parameters:
      - name: jahr
        in: path
        description: Jahr des Wettbewerbs
        required: true
        schema:
          pattern: "^[\\d]{4}$"
          type: string
      - name: klassenstufe
        in: path
        description: Klassenstufe
        required: true
        schema:
          $ref: '#/components/schemas/Klassenstufe'
      - name: nummer
        in: path
        description: Nummer der Aufgabe
        required: true
        schema:
          pattern: "^[ABC]-\\d$"
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatistikAufgabe'
        "400":
          description: Inputvalidierung schlug fehl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolationResponse'
        "401":
          description: S2S-Autentifizierung schlug fehl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
        "404":
          description: Jahr existsiert nicht oder Wettbewerb ist noch nicht beendet
            oder Aufgabennummer existsiert nicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
        "500":
          description: Serverfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePayload'
components:
  schemas:
    AboutDto:
      description: Informationen über die API
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        beschreibung:
          type: string
        urls:
          type: array
          items:
            type: string
        schluesselwoerter:
          type: string
        keywords:
          type: string
        version:
          type: string
    Aufgabe:
      description: Eine Aufgabe eines Minkänguru-Wettbewerbs
      type: object
      properties:
        nummer:
          description: Nummer der Aufgabe im Wettbewerb
          type: string
        punkte:
          format: int32
          description: Punkte für diese Aufgabe.
          type: integer
        strafpunkte:
          description: Strafpunkte bei falscher Lösung.
          type: string
        loesungsbuchstabe:
          description: der korrekte Lösungsbuchstabe
          type: string
        quelle:
          description: Quelle ür eine Zitatsection
          type: string
        images:
          description: "Images, die angezeigt werden können. Frage und optionale Lö\
            sung"
          type: object
          allOf:
          - $ref: '#/components/schemas/Images'
        statistik:
          description: Statistik zu dieser Aufgabe
          type: object
          allOf:
          - $ref: '#/components/schemas/StatistikAufgabe'
    ConstraintViolation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    ConstraintViolationResponse:
      type: object
      properties:
        title:
          type: string
        status:
          format: int32
          type: integer
        violations:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintViolation'
    Gruppierungsitem:
      description: Gruppierungsitem - label und Anzahl
      type: object
      properties:
        name:
          description: "Semantik für die Anzahl, kann so als Text in einer GUI verwendet\
            \ werden"
          type: string
          example: Klasse 1
        anzahl:
          format: int64
          description: Anzahl Elemente mit dieser Semantik
          type: integer
          example: 356
    Images:
      description: Objekt das ein png mit dem Text für die Frage/Quizaufgabe und ein
        png mit dem Text für die Lösung enthält
      type: object
      properties:
        imageFrage:
          format: binary
          description: Base64-encodetes png mit dem Text der Frage/Quizaufgabe. Kann
            mit einem img src="data:image/png;base64- Tag angezeigt werden
          type: string
        imageLoesung:
          format: binary
          description: Base64-encodetes png mit dem Text der Lösung. Kann mit einem
            img src="data:image/png;base64- Tag angezeigt werden
          type: string
    Klassenstufe:
      enum:
      - IKID
      - EINS
      - ZWEI
      type: string
    MessagePayload:
      description: eine kategorisierte Meldung
      type: object
      properties:
        level:
          description: "Level der Message: INFO | WARN | ERROR"
          type: string
        message:
          description: die message
          type: string
    MinikaenguruKlassenstufeDto:
      description: Aufgaben und Lösungen eines Minkänguru-Wettbewerbs für eine gegebene
        Klassenstufe
      type: object
      properties:
        wettbewerbsjahr:
          description: Jahr des Wettbewerbs
          type: string
        klassenstufe:
          description: Klassenstufe in menschenlesbarer Form
          type: string
        aufgaben:
          description: die einzelnen Aufgaben mit Lösungen
          type: array
          items:
            $ref: '#/components/schemas/Aufgabe'
    StatistikAufgabe:
      description: Statistik zu einer Aufgabe
      type: object
      properties:
        anzahlRichtig:
          format: int64
          description: Anzahl richtiger Lösungen
          type: integer
          example: 245
        anzahlFalsch:
          format: int64
          description: Anzahl falscher Lösungen
          type: integer
          example: 524
        anzahlNicht:
          format: int64
          description: Anzahl Aufgabe ausgelassen
          type: integer
          example: 102
    StatusWettbewerb:
      enum:
      - ERFASST
      - ANMELDUNG
      - DOWNLOAD_LEHRER
      - DOWNLOAD_PRIVAT
      - BEENDET
      type: string
    Wettbewerb:
      description: "Daten eines Wettbewerbs, der ausgewählt werden kann"
      type: object
      properties:
        jahr:
          format: int32
          description: Wettbewerbsjahr
          type: integer
          example: 2020
        status:
          description: Status des Wettbewerbs
          type: string
          allOf:
          - $ref: '#/components/schemas/StatusWettbewerb'
          example: BEENDET
        anzahlKinder:
          format: int64
          description: Anzahl der Kinder (ist eine untere Schranke)
          type: integer
          example: 12524
        medianeJeKlassenstufe:
          description: Mediane je Klassenstufe
          type: array
          items:
            $ref: '#/components/schemas/Gruppierungsitem'
    WettbewerbDetails:
      description: Stellt die statistischen Details eine Minikänguru-Wettbewerbs zur
        Verfügung
      type: object
      properties:
        jahr:
          format: int32
          description: Wettbewerbsjahr
          type: integer
          example: 2020
        anzahlKinderGesamt:
          format: int32
          description: "untere Schranke für die Anzahl aller Kinder, die teilgenommen\
            \ haben"
          type: integer
          example: 16534
        anzahlPrivatanmeldungen:
          format: int64
          description: "Anzahl aller Privatveranstalter, die sich angemeldet hatten"
          type: integer
          example: 143
        anzahlSchulanmeldungen:
          format: int64
          description: "Anzahl aller Schulen, die sich angemeldet hatten"
          type: integer
          example: 623
        teilnehmendeSchulenGesamt:
          format: int64
          description: "untere Schranke für die Anzahl aller Schulen, die teilgenommen\
            \ haben"
          type: integer
          example: 423
        klassenstufen:
          description: "Klassenstufen, zu denen Daten vorliegen"
          type: array
          items:
            $ref: '#/components/schemas/Klassenstufe'
        schulenJeLand:
          description: Anzahl der teilnehmenden Schulen je Land (untere Schranke)
          type: array
          items:
            $ref: '#/components/schemas/Gruppierungsitem'
        schulkinderJeLand:
          description: Anzahl der teilnehmenden Kinder je Land (untere Schranke)
          type: array
          items:
            $ref: '#/components/schemas/Gruppierungsitem'
        kinderJeTeilnahmeart:
          description: Anzahl der teilnehmenden Kinder je Teilnahmeart (PRIVAT/SCHULE
            - untere Schranke)
          type: array
          items:
            $ref: '#/components/schemas/Gruppierungsitem'
        kinderJeKlassenstufe:
          description: Anzahl der teilnehmenden Kinder je Klassenstufe (IKID/EINS/ZWEI
            - untere Schranke)
          type: array
          items:
            $ref: '#/components/schemas/Gruppierungsitem'
        kinderJeSprache:
          description: Anzahl der teilnehmenden Kinder je Sprache (de/en - untere
            Schranke)
          type: array
          items:
            $ref: '#/components/schemas/Gruppierungsitem'
        medianeJeKlassenstufe:
          description: Mediane je Klassenstufe
          type: array
          items:
            $ref: '#/components/schemas/Gruppierungsitem'
